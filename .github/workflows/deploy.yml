name: Python Backend CI & Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-test:
    name: Security Audits & Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Secret Leak Prevention Scan (TruffleHog)
      uses: trufflesecurity/trufflehog@main
      with:
        extra_args: --only-verified

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: '.python-version'
        cache: 'pip'
        cache-dependency-path: |
          backend/requirements.txt
          backend/requirements-dev.txt

    - name: Upgrade pip and install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements-dev.txt

    - name: CVE Vulnerability Audit (pip-audit)
      run: |
        echo "🔍 Scanning production dependencies for known CVEs..."
        pip-audit -r backend/requirements.txt --strict
        echo "🔍 Scanning dev/test dependencies for known CVEs..."
        pip-audit -r backend/requirements-dev.txt --strict

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Audit npm dependencies
      run: |
        echo "🔍 Auditing npm package dependencies for known vulnerabilities..."
        npm audit --audit-level=high

    - name: Static Security Analysis (Bandit SAST)
      run: |
        echo "🛡️ Running Bandit static security analysis..."
        bandit -r backend/app/ -ll

    - name: Run Pytest Test Suite
      run: |
        echo "🧪 Executing unit test suite..."
        PYTHONPATH=. pytest backend/tests/

    - name: Repository CVE & Vulnerability Scan (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'
